[DEFAULT]

#
# Global configuration settings
#
OBJECT_TYPE=0
GLOBAL_DEBUGLEVEL= -DDEBUG_LEVEL=5

GLOBAL_COMPILEFLAGS= -Wall

OPTION_FLAGS = -DOBJECT_TYPE=%(OBJECT_TYPE)s
GLOBAL_BUILDFLAGS= %(GLOBAL_COMPILEFLAGS)s %(GLOBAL_DEBUGLEVEL)s %(OPTION_FLAGS)s

[platformio]
# Machine-local, and inherited from every other project under platformio/ rather than chosen here.
# The entries in that directory are symlinks into an ArduinoLibs checkout, which is NOT necessarily
# this one -- so a `pio run` here can compile a different copy of RFM95Socket than the one you just
# edited. Confirm the symlink resolves to this checkout before trusting a result. Repointing this at
# the repo is tracked separately; changing it here alone would just split the convention.
lib_dir = /Users/amp/Dropbox/Arduino/libraries
src_dir = ../../../RFM95Socket/examples/RFM95_SocketTest

#
# SparkFun ESP32 LoRa 1-CH Gateway (WRL-15006), two nodes.
#
# `board = esp32dev`, deliberately matching HMTL_Module's [env:esp32_lora_gw] rather than using
# SparkFun's own sparkx_esp32_lora variant. That variant redefines SS/MOSI/MISO/SCK to the radio's
# pins, which would hide the fact that RFM95Socket::setup() has to bind SPI explicitly -- and the
# firmware that matters is built with esp32dev, so this should fail the same way that one would.
#
# Flash the two envs to two boards; they address each other.
#
[env:esp32_lora_gw_a]
platform = espressif32
framework = arduino
board = esp32dev
build_flags = %(GLOBAL_BUILDFLAGS)s -DNODE_ADDRESS=0x0001 -DPEER_ADDRESS=0x0002
lib_deps = sandeepmistry/LoRa@0.8.0
monitor_speed = 115200

[env:esp32_lora_gw_b]
platform = espressif32
framework = arduino
board = esp32dev
build_flags = %(GLOBAL_BUILDFLAGS)s -DNODE_ADDRESS=0x0002 -DPEER_ADDRESS=0x0001
lib_deps = sandeepmistry/LoRa@0.8.0
monitor_speed = 115200
